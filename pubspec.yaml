name: dinasona
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dio: ^5.4.3+1
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  flutter:
    sdk: flutter
  breez_liquid:
    git:
      url: https://github.com/breez/breez-sdk-liquid-dart
  flutter_breez_liquid:
    git:
      url: https://github.com/breez/breez-sdk-liquid-flutter
  rxdart: ^0.28.0
  flutter_html: ^3.0.0-beta.2
  flutter_native_splash: ^2.4.0
  internet_connection_checker_plus: ^2.7.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  gap: ^3.0.1
  get: ^4.6.6
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  html: ^0.15.4
  http: ^1.2.1
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  is_first_run: ^1.0.0
  local_auth: ^2.2.0
  material_symbols_icons: ^4.2780.0
  package_info_plus: ^8.1.0
  shared_preferences: ^2.2.3
  sign_in_with_apple: ^6.1.1
  thor_devkit_dart: ^1.1.0
  upgrader: ^10.3.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  auto_size_text: ^3.0.0
  bip39: ^1.0.6
  dotted_border: ^2.1.0
  qr_flutter: ^4.1.0
  auto_size_text_field: ^2.2.4
  share_plus: ^10.0.0
  mobile_scanner: ^6.0.2
  pinput: ^5.0.0
  flutter_spinkit: ^5.2.1
  flutter_rust_bridge: ^2.7.0
  flutter_launcher_icons: "^0.14.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  image_path: "assets/images/logos/app_icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logos/app_icon.png"
  adaptive_icon_scale: 1.2
  ios: true
  remove_alpha_ios: true

flutter:
  assets:
    - assets/
    - assets/locale/
    - assets/images/
    - assets/images/tutorial/
    - assets/images/need_fields/
    - assets/images/logos/
    - assets/images/flags/

  uses-material-design: true
